// Old /traditional/... links forward to their new home; unknown ones land on the homepage.
(function () {
  var pages = /*LEGACY_PAGES*/{};
  var m = location.pathname.match(/^\/traditional(\/.*)?$/);
  if (m) {
    var rest = m[1] || '/', has = Object.prototype.hasOwnProperty, to = null;
    var keys = [rest, rest + '/', rest.replace(/\/+$/, ''), rest.replace(/\.html$/, ''), rest.replace(/index\.html$/, '')];
    for (var i = 0; i < keys.length && !to; i++) if (has.call(pages, keys[i])) to = pages[keys[i]];
    location.replace(to || (/^\/(files|images)\//.test(rest) ? rest : '/'));
  }
  try { var t = JSON.parse(localStorage.getItem('yaxin.grimoire.preferences') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
})();

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{min-height:100vh;font-family:var(--sans);background-image:radial-gradient(circle at 1.5px 1.5px,var(--dot) 1.1px,transparent 1.6px);background-size:20px 20px;overflow-x:hidden}
.rx,.ry,.corner{position:fixed;background-color:var(--bg);z-index:2}
.corner{left:0;top:0;width:24px;height:24px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);z-index:3}
.corner::after{content:"";position:absolute;inset:7px;border:1.5px solid var(--faint);border-radius:2px;opacity:.6}
.rx{left:24px;right:0;top:0;height:24px;border-bottom:1px solid var(--line);background-image:repeating-linear-gradient(90deg,var(--line-2) 0 1px,transparent 1px 10px),repeating-linear-gradient(90deg,var(--faint) 0 1px,transparent 1px 100px);background-size:100% 5px,100% 10px;background-position:0 100%;background-repeat:repeat-x}
.ry{top:24px;bottom:0;left:0;width:24px;border-right:1px solid var(--line);background-image:repeating-linear-gradient(0deg,var(--line-2) 0 1px,transparent 1px 10px),repeating-linear-gradient(0deg,var(--faint) 0 1px,transparent 1px 100px);background-size:5px 100%,10px 100%;background-position:100% 0;background-repeat:repeat-y}
main{position:relative;min-height:100vh;padding:clamp(72px,14vh,150px) clamp(28px,4.2vw,88px) 64px calc(24px + clamp(28px,8vw,160px));max-width:1100px}
.insp{display:flex;width:max-content;align-items:stretch;height:30px;border-radius:9px;background:var(--card);border:1px solid var(--line-2);box-shadow:var(--shadow);font:500 12px var(--mono);color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden}
.insp>span{display:flex;align-items:center;gap:6px;padding:0 10px;min-width:0}.insp>span+span{border-left:1px solid var(--line)}

.sel{position:relative;display:block;width:max-content;margin:46px 0 0 16px}

.sel i{position:absolute;width:11px;height:11px;border:1.8px solid var(--accent);background:var(--bg);border-radius:2px}
.sel .tl{left:-21.5px;top:-13.5px}.sel .tr{right:-21.5px;top:-13.5px}.sel .bl{left:-21.5px;bottom:-11.5px}.sel .br{right:-21.5px;bottom:-11.5px}
.sel .tm{left:calc(50% - 5.5px);top:-13.5px}.sel .bm{left:calc(50% - 5.5px);bottom:-11.5px}.sel .ml{left:-21.5px;top:calc(50% - 5.5px)}.sel .mr{right:-21.5px;top:calc(50% - 5.5px)}
.sel h1{position:relative;margin:0;padding:2px 4px 6px;font:700 clamp(84px,13vw,168px)/1 var(--serif);letter-spacing:-.01em;color:var(--ink)}
.sel .dim{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);height:21px;padding:0 8px;border-radius:4px;background:var(--accent);color:var(--accent-ink);font:500 11.5px/21px var(--mono);white-space:nowrap}
.cur{position:absolute;left:calc(100% + 26px);top:18%;pointer-events:none}
.cur svg{display:block;width:22px;height:30px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}.cur path{fill:var(--critic);stroke:var(--bg);stroke-width:1.6;stroke-linejoin:round}
.cur .lbl{position:absolute;left:15px;top:22px;height:24px;padding:0 9px;border-radius:12px;background:var(--critic);color:var(--critic-ink);font:700 13px/24px var(--sans);white-space:nowrap}
.bubble{position:absolute;left:calc(100% + 64px);top:calc(18% + 54px);display:flex;align-items:center;gap:8px;padding:6px 12px 6px 7px;border-radius:14px;background:var(--card);border:2px solid var(--critic);box-shadow:var(--shadow);font:500 14.5px/1.2 var(--sans);color:var(--ink);white-space:nowrap}
.bubble b{width:20px;height:20px;border-radius:50%;background:var(--critic);color:var(--critic-ink);font:700 12px/20px var(--sans);text-align:center;flex:none}
h2{margin:46px 0 0;font:500 clamp(22px,2.4vw,30px)/1.25 var(--sans);letter-spacing:-.004em;max-width:22em}
.zh{margin:8px 0 0;font:400 clamp(16px,1.5vw,19px)/1.5 var(--sans);color:var(--muted)}
.note{margin:14px 0 0;max-width:36em;font:400 16px/1.6 var(--sans);color:var(--muted)}
nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
nav a{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 17px;border-radius:21px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);font:500 15px var(--sans);text-decoration:none;transition:transform .15s,border-color .15s,box-shadow .15s}
nav a:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
nav a.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav a .ar{opacity:.6;font-size:13px}
nav svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
footer{position:fixed;left:24px;right:0;bottom:0;height:38px;display:flex;align-items:center;gap:8px;padding:0 clamp(28px,4.2vw,88px);border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 90%,transparent);font:500 12px var(--mono);color:var(--faint);z-index:2}
footer b{color:var(--ink);font-weight:500}
footer .dot{width:7px;height:7px;border-radius:50%;background:var(--critic);box-shadow:0 0 0 3px color-mix(in srgb,var(--critic) 18%,transparent)}
@media (max-width:760px){.cur,.bubble{display:none}main{padding-left:calc(24px + 28px)}}
@media (prefers-reduced-motion:reduce){nav a{transition:none}}
</style>
