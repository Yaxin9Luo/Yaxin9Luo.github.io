<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>muye fx preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a2622; overflow: hidden; font: 12px/1.4 ui-monospace, Menlo, monospace; color: #14110F; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #panel { position: fixed; left: 8px; top: 8px; width: 330px; max-height: calc(100vh - 16px); overflow: auto; background: rgba(239, 231, 214, .92); padding: 6px 8px; box-sizing: border-box; }
  body.clean #panel { display: none; }
  #panel h4 { margin: 7px 0 3px; font: 600 11px/1.2 ui-monospace, Menlo, monospace; color: #6B645C; letter-spacing: .04em; text-transform: uppercase; }
  #panel button { font: inherit; margin: 0 3px 3px 0; padding: 2px 6px; border: 1px solid #6B645C; background: #EFE7D6; color: #14110F; border-radius: 2px; cursor: pointer; }
  #panel button:hover { background: #fff; }
  #panel button.on { background: #14110F; color: #EFE7D6; }
  #panel button:focus-visible { outline: 2px solid #B8321F; outline-offset: 1px; }
  #hud { margin-top: 6px; white-space: pre; color: #35302B; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel"></div>
<!--
  The effects of the survivors-like, driven by the real rules (world/src/muye/sim.js): a treasure given at a level fires by
  itself at foes placed on the field. The figures are stand-ins cut from the side-view game's puppets, as in the field study.
  A button for every treasure and level, every squad and formation, every thing to be read; pause, slow motion, a frame stepper.
  ?clean=1 hides the panel; ?auto=0 stops the clock (window.fxp.step(n)).
-->
<script type="module" src="./preview.js"></script>
</body>
</html>
