<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Living sky · Specimen studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17202a;color:#e7e4d8;font:14px system-ui}main{display:grid;grid-template-columns:290px 1fr;height:100dvh}aside{padding:24px;overflow:auto;background:#15202a;border-right:1px solid #d7c59330}h1{font:30px Georgia;margin:8px 0 10px}p{line-height:1.6;color:#c0c9c5}label{display:block;margin-top:18px;color:#d2c4a2;font-size:12px}button,select,input{font:inherit;color:inherit;background:#ffffff08;border:1px solid #d7c59340;border-radius:5px;padding:9px}select,input{width:100%;margin-top:7px}button{cursor:pointer}button:disabled{opacity:.4;cursor:wait}button[aria-pressed=true]{background:#bea57230;border-color:#d7c593}a{color:#e4c898}.views{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}.views button{font-size:12px}.actions{display:grid;gap:8px;margin:22px 0}canvas{width:100%;height:100%;display:block;min-width:0;touch-action:none}pre{white-space:pre-wrap;font-size:11px;color:#a5b8b9;line-height:1.7}#status[data-error=true]{color:#ffb2a0}.caption{font-size:12px}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #f2cd85;outline-offset:3px}@media(max-width:720px){main{grid-template-columns:220px 1fr}aside{padding:14px}h1{font-size:24px}}
</style></head><body><main><aside>
<a href="/asset-studio.html">← Asset studio</a><h1>Living sky</h1><p class="caption">Actual exportable specimens · 原始模型预览<br>Original geometry, full detail, native pixels.</p>
<label>Specimen / 模型<select id="kind"><option value="swallow">Swallow / 燕子</option><option value="paper-lantern">Paper lantern / 纸灯</option><option value="lantern-pair">Overlapping paper / 双灯</option><option value="firefly">Firefly / 萤火虫</option></select></label>
<label>Light / 光线<select id="light"><option value="neutral">Neutral / 中性</option><option value="day">Day / 日光</option><option value="dusk">Dusk / 黄昏</option><option value="night">Night / 月光</option></select></label>
<label>Pose / 姿态<select id="pose"><option value="glide">Glide / 滑翔</option><option value="upstroke">Upstroke / 上收</option><option value="downstroke">Downstroke / 下拍</option><option value="bank">Bank / 侧倾</option><option value="flight">Flight sequence / 飞行</option></select></label>
<label>Backdrop / 背景<select id="backdrop"><option value="neutral">Neutral</option><option value="leaf">Leaf green</option><option value="stone">Pale stone</option><option value="water">Dark water</option></select></label>
<label>Ground clearance / 地面距离<select id="ground"><option value="habitat">Habitat: 80 cm (firefly)</option><option value="near">Diagnostic: 3 cm (firefly)</option><option value="off">Floor off</option></select></label>
<div class="views"><button data-view="threequarter">¾</button><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="back">Back</button><button data-view="above">Above</button><button data-view="below">Below</button><button data-view="close">Close</button><button data-view="distance">Player distance</button></div>
<label>Exact activity time / 秒<input id="time" type="number" min="0" max="1000" step="0.05" value="0"></label>
<div class="actions"><button id="play" aria-pressed="false">Play / 播放</button><button id="frame">Save actual frame / 保存渲染</button><button id="record">Record 10 s / 录制</button><button id="clay" aria-pressed="false">Clay / 素模</button><button id="wire" aria-pressed="false">Wireframe / 网格</button></div>
<p id="status" role="status">Preparing specimen…</p><pre id="readout"></pre><p id="downloads" class="caption"></p><p class="caption">Drag to orbit · Scroll to zoom<br>Photos are research only. Mesh recipes and provenance accompany the exported assets.</p>
</aside><canvas aria-label="Actual living sky specimen"></canvas></main><script type="module" src="/src/fauna-studio.js"></script></body></html>
