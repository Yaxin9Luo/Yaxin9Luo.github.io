<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1024" viewBox="0 0 1120 1024" role="img" aria-labelledby="title desc">
<title id="title">万方安和：分间与水院 / Wanfang Anhe: bays and water inlets</title>
<desc id="desc">数字模型平面关系示意，中央十字十三间，外围四支各五间；三座桥与南面码头连接水陆。此为当代解释图，不是清代原图或实测图。 Interpretive diagram of the digital model: thirteen central bays, four wings of five bays, three bridges and a southern landing. Not a Qing drawing or measured survey.</desc>
