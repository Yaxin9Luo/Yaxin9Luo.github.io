<!doctype html>
<html lang="en"><head>
<link rel="icon" type="image/svg+xml" href="/crest.svg">
<meta name="portfolio-release" content="2026.09.14.3"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#EFE7D6">
<title>牧野 · Muye</title>
<meta name="description" content="Muye (牧野): ride the divine horse Jiliang across the field while your treasures, troops and generals fight by themselves. Keyboard needed. 骑神马吉量纵横战场，法宝、兵阵与神将自行出手。">
<meta name="robots" content="noindex">
<meta property="og:title" content="牧野 · Muye">
<meta property="og:description" content="A survival battle in ink: ride the divine horse Jiliang while your treasures, troops and generals fight by themselves.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Yaxin Luo">
<style>.cannot{position:fixed;inset:0;z-index:9;display:grid;place-content:center;gap:10px;padding:24px;background:#EFE7D6;color:#14110F;font:16px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;text-align:center}.cannot b{font-size:26px}</style>
</head>
<body>
  <canvas id="field" tabindex="0" aria-label="Muye: the battlefield"></canvas>
  <canvas id="marks" aria-hidden="true"></canvas>
  <div id="veil" aria-hidden="true"></div>
  <div id="hurt" aria-hidden="true"></div>

  <header id="top">
    <i id="xp" aria-hidden="true"><i id="xp-fill"></i></i>
    <div class="side left">
      <a id="back" href="/">← Yaxin Luo</a>
      <div class="vital" id="hp" hidden><span class="label" id="hp-label"></span><i class="track"><i class="fill" id="hp-fill"></i></i><span class="num" id="hp-num"></span></div>
      <div class="vital" id="spirit" hidden><strong id="level"></strong><span class="label" id="xp-label"></span><span class="num" id="xp-num"></span></div>
    </div>
    <strong id="timer" role="timer" hidden></strong>
    <div class="side right">
      <div class="vital" id="dash" hidden><kbd id="dash-key">Space</kbd><span class="label" id="dash-label"></span><i class="track"><i class="fill" id="dash-fill"></i></i></div>
      <div class="vital" id="remain" hidden><i class="rseal" id="remain-seal" aria-hidden="true"></i><span class="label" id="remain-label"></span><span class="num" id="remain-num"></span><small id="remain-more"></small></div>
      <div class="vital" id="kills" hidden><span class="label" id="kills-label"></span><span class="num" id="kills-num"></span></div>
      <span class="tools"><button id="sound"></button><button id="lang">中文</button></span>
    </div>
  </header>
  <div id="afflict" role="status" aria-live="polite"></div>
  <section id="build" aria-label="Build" hidden></section>
  <section id="timeline" aria-label="Campaign" hidden><div class="tl-track"></div><p class="next" aria-live="off"></p></section>
  <section id="bossbar" aria-live="polite"><div class="who"><span class="bseal" aria-hidden="true"></span><strong></strong><small></small><span class="bward" hidden></span></div><canvas aria-hidden="true"></canvas><span class="bphase"></span></section>
  <div id="herald" role="status" aria-live="polite"><i class="roller l"></i><div class="paper"><img class="hface" alt="" decoding="async" hidden><small class="kicker"></small><strong></strong><span class="sub"></span><span class="extra"></span></div><i class="roller r"></i></div>

  <div id="banner" role="status" aria-live="polite"></div>
  <section id="offer" role="dialog" aria-modal="false" hidden>
    <p id="offer-title"></p>
    <div id="slips" role="group"></div>
    <div id="offer-tools">
      <button id="reroll" data-do="reroll"><kbd>R</kbd><span></span><b></b></button>
      <button id="banish" data-do="banish"><kbd>B</kbd><span></span><b></b></button>
    </div>
  </section>

  <pre id="perf" hidden></pre>
  <section id="camp" aria-label="Before the battle" hidden></section>
  <section id="sheet" class="sheet show" aria-live="polite"><div id="sheet-body"><p class="note">grinding ink… 正在研墨…</p></div></section>
  <noscript><div class="cannot"><b>牧野 · Muye</b><span>This game needs JavaScript. Please turn it on and reload.</span><span>这个游戏需要 JavaScript，请开启后刷新。</span><a href="/">← Yaxin Luo</a></div></noscript>
  <script nomodule>document.body.insertAdjacentHTML('beforeend','<div class="cannot"><b>牧野 · Muye</b><span>This browser is too old to run the game. A recent Chrome, Edge, Firefox or Safari will do.</span><span>这个浏览器版本太旧，无法运行游戏。请使用较新的 Chrome、Edge、Firefox 或 Safari。</span><a href="/">← Yaxin Luo</a></div>');</script>
  <script type="module" src="/src/muye2/main.js"></script>
</body></html>
