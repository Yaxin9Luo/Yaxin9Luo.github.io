name: Build enchanted world and traditional site

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages (master branch only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: world-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: world/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: npm --prefix world ci
      - run: npm --prefix world test
      - run: npm run build:site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy combined website
        id: deployment
        uses: actions/deploy-pages@v4
